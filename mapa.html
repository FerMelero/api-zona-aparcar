<!doctype html>
<html><head><meta charset="utf-8"><title>Zonas de aparcamiento Madrid</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body,#map{height:100%;margin:0}
  #leyenda{position:absolute;z-index:1000;top:10px;right:10px;background:#fff;padding:8px 12px;border-radius:6px;font:14px sans-serif;box-shadow:0 1px 5px #0006}
  #leyenda i{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:middle}
  #estado{position:absolute;z-index:1000;bottom:10px;left:10px;background:#fff;padding:4px 8px;border-radius:6px;font:13px sans-serif}
</style></head>
<body><div id="map"></div><div id="leyenda"></div><div id="estado">Cargando…</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLORES = {Verde:"#1a9850", Azul:"#2166ac", Naranja:"#f58220", Rojo:"#d7191c",
                 "Alta Rotación":"#8e24aa", Gris:"#9e9e9e", "":"#000"};
const map = L.map("map", {preferCanvas:true}).setView([40.4168,-3.7038], 14);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:19, attribution:"© OpenStreetMap · Datos: Ayuntamiento de Madrid"}).addTo(map);

fetch("zonas.geojson").then(r => r.json()).then(data => {
  const capas = {};
  for (const color in COLORES) capas[color] = L.layerGroup();
  L.geoJSON(data, {
    style: f => ({color: COLORES[f.properties.Color] ?? "#000", weight: 4, opacity: .85}),
    onEachFeature: (f, l) => l.bindPopup(
      `<b>${f.properties.Color || "Sin color"}</b><br>${f.properties.Bateria_Linea}<br>${f.properties.Res_NumPlazas} plazas`)
  }).addTo(map);
  document.getElementById("estado").textContent = data.features.length + " tramos";
  document.getElementById("leyenda").innerHTML = Object.entries(COLORES).filter(([k])=>k)
    .map(([k,c]) => `<div><i style="background:${c}"></i>${k}</div>`).join("");
});
</script></body></html>
